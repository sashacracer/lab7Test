name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check any
        uses: actions/checkout@v6

      - name: install Dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ['6.0.x', '8.0.x', '9.0.x']
        
      - name: Build
        run: dotnet build Console.App/Console.App.csproj


